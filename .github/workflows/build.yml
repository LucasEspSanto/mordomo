name: Build Mordomo APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q Mordomo-pronto-para-build.zip -d .

      - name: Build APK
        working-directory: Mordomo
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Mordomo-APK
          path: Mordomo/app/build/outputs/apk/debug/app-debug.apk
